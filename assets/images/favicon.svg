<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Royal Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="25%" stop-color="#dfba73" />
      <stop offset="65%" stop-color="#c59d5f" />
      <stop offset="100%" stop-color="#8d672d" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143527" />
      <stop offset="50%" stop-color="#0a1c14" />
      <stop offset="100%" stop-color="#05140d" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfba73" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a1c14" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Emerald Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="240" fill="url(#goldGlow)" />

  <!-- Outer Ornate Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Inner Gold Ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Decorative Corner Dots -->
  <circle cx="256" cy="28" r="6" fill="url(#goldGrad)" />
  <circle cx="256" cy="484" r="6" fill="url(#goldGrad)" />
  <circle cx="28" cy="256" r="6" fill="url(#goldGrad)" />
  <circle cx="484" cy="256" r="6" fill="url(#goldGrad)" />

  <!-- Royal Crown on Top -->
  <g filter="url(#subtleShadow)">
    <path d="M196 150 L216 195 L256 160 L296 195 L316 150 L326 210 L186 210 Z" fill="url(#goldGrad)" />
    <!-- Crown Pearls -->
    <circle cx="196" cy="144" r="7" fill="#fff" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="256" cy="152" r="8" fill="#fff" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="316" cy="144" r="7" fill="#fff" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Crown Base Band -->
    <rect x="186" y="212" width="140" height="12" rx="4" fill="url(#goldGrad)" />
    <!-- Crown Jewels -->
    <circle cx="216" cy="218" r="3.5" fill="#e1306c" />
    <circle cx="256" cy="218" r="4" fill="#00ffff" />
    <circle cx="296" cy="218" r="3.5" fill="#e1306c" />
  </g>

  <!-- Ornate Luxury Monogram 'R' -->
  <g filter="url(#subtleShadow)">
    <!-- Main Serif 'R' Body -->
    <path d="M 190,245 
             L 270,245 
             C 320,245 345,270 345,305 
             C 345,335 325,355 285,365 
             L 345,435 
             L 300,435 
             L 248,370 
             L 225,370 
             L 225,435 
             L 190,435 
             Z
             M 225,275 
             L 225,340 
             L 265,340 
             C 295,340 310,330 310,305 
             C 310,285 295,275 265,275 
             Z" 
          fill="url(#goldGrad)" />
          
    <!-- Decorative Serif Flourishes & Swirl -->
    <path d="M 175,245 L 210,245 M 175,435 L 240,435" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 335,435 C 350,435 365,445 365,425" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Subtitle Tagline Arch / Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="256,455 260,465 270,465 262,471 265,481 256,475 247,481 250,471 242,465 252,465" />
    <polygon points="216,450 219,457 227,457 220,462 223,470 216,465 209,470 212,462 205,457 213,457" transform="scale(0.8) translate(50, 80)" />
    <polygon points="296,450 299,457 307,457 300,462 303,470 296,465 289,470 292,462 285,457 293,457" transform="scale(0.8) translate(75, 80)" />
  </g>
</svg>
